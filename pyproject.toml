[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-revolve"
version = "0.1.0"
description = "Optimal adjoint checkpoint schedules for transformer chains in PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=2.0",
    "plotly>=5.0",
    "torch>=2.6",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "hardware: requires a CUDA or MPS accelerator",
]

[tool.setuptools.packages.find]
where = ["src"]

