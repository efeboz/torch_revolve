    <text x="12" y="108">unit 2</text><text x="12" y="146">unit 3</text>
    <text x="90" y="190">time / action index →</text>
  </g>
  <g stroke="#e2e8f0"><path d="M75 28H740M75 66H740M75 104H740M75 142H740"/></g>
  <g fill="#94a3b8">
    <circle cx="100" cy="28" r="7"/><circle cx="160" cy="66" r="7"/>
    <circle cx="220" cy="104" r="7"/><circle cx="280" cy="142" r="7"/>
    <circle cx="460" cy="28" r="7"/><circle cx="580" cy="66" r="7"/>
  </g>
  <g fill="#2563eb"><rect x="123" y="21" width="14" height="14"/><rect x="363" y="97" width="14" height="14"/></g>
  <g fill="#d97706"><path d="M330 21l-12 7 12 7z"/><path d="M430 21l-12 7 12 7z"/><path d="M550 59l-12 7 12 7z"/></g>
  <g stroke="#dc2626" stroke-width="3">
