<svg xmlns="http://www.w3.org/2000/svg" width="760" height="210" viewBox="0 0 760 210" role="img" aria-labelledby="title description">
  <title id="title">Example revolve schedule</title>
  <desc id="description">Forward, store, restore, and backward actions across four chain units.</desc>
  <rect width="760" height="210" fill="#ffffff"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#0f172a">
