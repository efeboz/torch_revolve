    <rect x="205" y="168" width="12" height="12" fill="#2563eb"/><text x="225" y="178">store</text>
    <path d="M300 168l-10 6 10 6z" fill="#d97706"/><text x="307" y="178">restore</text>
    <path d="M380 168l12 12m0-12l-12 12" stroke="#dc2626" stroke-width="3"/><text x="400" y="178">backward</text>
